server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mcnwly.com.br www.mcnwly.com.br;

    ssl_certificate /etc/letsencrypt/live/mcnwly.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcnwly.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 3m;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self'; form-action 'self'; frame-ancestors 'self'; img-src 'self' data: blob:; object-src 'none'; script-src 'self'; style-src 'self'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;

    location = /bingo {
        return 301 /bingo/;
    }

    location /bingo/api/ {
        proxy_pass http://127.0.0.1:5138/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /bingo/hubs/ {
        proxy_pass http://127.0.0.1:5138/hubs/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /bingo/index.html {
        alias /opt/bingo/frontend/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location /bingo/assets/ {
        alias /opt/bingo/frontend/assets/;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /bingo/ {
        alias /opt/bingo/frontend/;
        try_files $uri $uri/ /bingo/index.html;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name mcnwly.com.br www.mcnwly.com.br;

    return 301 https://$host$request_uri;
}
